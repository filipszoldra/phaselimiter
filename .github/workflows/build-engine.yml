name: build-engine
# Lean build: kompiluje wyłącznie binarki silnika i publikuje artifact `engine-bin`.
# BEZ jobów archive/test z build-win.yml (nie klonuje bakuage_dataset1, nie regeneruje
# sound_quality2_cache) — reużywamy istniejący cache, podmieniamy tylko phase_limiter.exe.
on:
  workflow_dispatch:
  push:
    branches:
      - 'engine-*'
env:
  CMAKE_COMMAND: 'cmake'
  MAKE_COMMAND: 'cmake --build . --config Release'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3.5.3
        with:
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.11
      - run: conda info
        shell: bash -el {0}
      - run: |
          conda install -y -c intel \
            tbb-devel==2019.2 \
            ipp-include==2019.2 \
            ipp-static==2019.2
        shell: bash -el {0}
      - run: |
          conda install -y -c conda-forge \
            boost==1.82.0 \
            armadillo==12.6.2 \
            libpng==1.6.39
        shell: bash -el {0}
      - run: conda list
        shell: bash -el {0}
      - run: mkdir -p /tmp/results
        shell: bash
      - name: build release version
        shell: bash
        env:
          CONDA_ROOT: C:/Miniconda/envs/test
        run: |
          $CMAKE_COMMAND -DCMAKE_BUILD_TYPE=Release -DSANDYBRIDGE_SUPPORT=ON -DDISABLE_TARGET_BENCH=ON -DDISABLE_TARGET_TEST=ON .
          ls -la
          bash -c "$MAKE_COMMAND"
      - name: collect binaries + runtime DLLs
        shell: bash
        env:
          CONDA_DLL_ROOT: C:/Miniconda/envs/test/Library/bin
        run: |
          cp -R bin/Release /tmp/results/bin
          cp prebuilt/win64/libsndfile-1.2.2-win64/bin/sndfile.dll /tmp/results/bin
          (
          cd C:/Miniconda/envs/test/Library/bin
          cp boost_system.dll \
            boost_filesystem.dll \
            boost_serialization.dll \
            boost_math_tr1.dll \
            boost_iostreams.dll \
            tbb.dll \
            tbbmalloc.dll \
            libbz2.dll \
            zlib.dll \
            zstd.dll \
            /tmp/results/bin
          )
      - run: mv /tmp/results D:/results
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: engine-bin
          path: D:/results
